<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · PCB Laser Artwork</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head>
<body class="builder-page"><main class="auth-card"><p class="eyebrow">PCB LASER ARTWORK</p><h1>Welcome back.</h1><p>Sign in with an approved account.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p><a href="{{ url_for('register') }}">Request an account</a></p></main></body></html>
