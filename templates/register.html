<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request an account · PCB Laser Artwork</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head>
<body class="builder-page"><main class="auth-card"><a class="back" href="{{ url_for('login') }}">← Sign in</a><p class="eyebrow">ACCOUNT REQUEST</p><h1>Ask to join.</h1><p>An administrator must approve your registration before you can use the project builder.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}{% if message %}<div class="saved-message">{{ message }}</div>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password <small>At least 12 characters</small><input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Send registration request</button></form>{% endif %}</main></body></html>
