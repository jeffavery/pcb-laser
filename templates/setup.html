<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First administrator · PCB Laser Artwork</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head>
<body class="builder-page"><main class="auth-card"><p class="eyebrow">ONE-TIME SETUP</p><h1>Create the administrator.</h1><p>This page closes permanently after the first administrator is created.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Administrator email<input name="email" type="email" autocomplete="email" required></label><label>Password <small>At least 12 characters</small><input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Create administrator</button></form></main></body></html>
